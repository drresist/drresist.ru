<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="description" content="DrResist — личный блог.">
  <title>DrResist — личный блог</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f1ea;
      --ink: #20251f;
      --muted: #777a70;
      --accent: #bd4b31;
      --line: #d9d5ca;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      width: min(100% - 48px, 1120px);
      margin-inline: auto;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header {
      min-height: 88px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .wordmark {
      color: var(--ink);
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.06em;
      text-decoration: none;
    }

    .wordmark span { color: var(--accent); }
    .edition { color: var(--muted); }

    main {
      display: grid;
      flex: 1;
      align-content: center;
      justify-items: start;
      padding: 100px 0 120px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    h1 {
      max-width: 850px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(58px, 10vw, 124px);
      font-weight: 500;
      letter-spacing: -.075em;
      line-height: .94;
    }

    h1 span { color: var(--accent); }

    .intro {
      max-width: 490px;
      margin: 32px 0 0;
      color: #55584f;
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.65;
    }

    footer {
      min-height: 76px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    footer a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 4px; }
    footer a:hover { color: var(--accent); }

    @media (max-width: 600px) {
      .page { width: min(100% - 36px, 1120px); }
      header { min-height: 72px; }
      main { padding: 80px 0 96px; }
      footer { gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="wordmark" href="/">dr<span>.</span>resist</a>
      <span class="edition">личный блог</span>
    </header>

    <main>
      <p class="eyebrow">Привет, я DrResist</p>
      <h1>Место для<br>моих <span>мыслей.</span></h1>
      <p class="intro">Личный блог о том, что кажется важным, интересным или просто заслуживает отдельной заметки.</p>
    </main>

    <footer>
      <span>© 2026 DrResist</span>
      <span>Первые заметки скоро</span>
    </footer>
  </div>
</body>
</html>
