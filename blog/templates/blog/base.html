{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="description" content="{% block description %}Личный блог DrResist — IT, здоровье и спорт.{% endblock %}">
  <title>{% block title %}DrResist{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'site.css' %}">
</head>
<body>
  <div class="page">
    <header>
      <a class="wordmark" href="{% url 'blog:home' %}">dr<span>.</span>resist</a>
      <nav class="site-nav" aria-label="Разделы">
        {% for c in nav_categories %}
          <a
            href="{% url 'blog:category' c.slug %}"
            {% if category and category.slug == c.slug %}aria-current="page"{% endif %}
          >{{ c.name }}</a>
        {% endfor %}
      </nav>
    </header>
    {% block content %}{% endblock %}
    <footer>
      <span>© 2026 DrResist</span>
      <span>личный блог</span>
    </footer>
  </div>
</body>
</html>
